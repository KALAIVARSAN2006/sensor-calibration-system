version: '3.8'

services:
  sensor-calibration-app:
    build: .
    image: kalaivarsan/sensor-calibration-mgmt:1.0.0
    container_name: sensor-calibration-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
